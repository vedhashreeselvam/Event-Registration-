<!DOCTYPE html>
<html>
    <head>
        <title>Event Registration</title>
    </head>
    <body>
        <h1>Event Registration</h1> <br> 
        <form action="inductionProgram.html">
        <label>Name :</label> <br> <input type="text" required> <br> <br>
        <label>Email:</label> <br> <input type="text" required> <br> <br>
        <label>Phone Number</label> <br> <input type="number" required> <br> <br>
        <label>Select Event</label>
        <select required> 
            <option>--Please choose an Event</option>
            <option>Workshop</option>
            <option>Seminor</option>
            <option>Conference</option>
            <option>Induction Program</option>
        </select> <br> <br>
        <button type="submit">Register</button>
        </form>

    </body>
</html>
